# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: với builder Dockerfile, Railway chạy startCommand ở
# dạng exec (không qua shell) nên `$PORT` không được thay → uvicorn nhận chuỗi
# "$PORT" và chết. CMD trong Dockerfile đã chạy qua `sh -c` và đọc ${PORT}.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
